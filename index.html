<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6b4f3a"><link rel="manifest" href="manifest.webmanifest"><title>Ma Bibliothèque</title>
<style>
:root{--bg:#eee3d2;--paper:#fffaf1;--ink:#3b2a20;--muted:#79695e;--wood:#7a4d2d;--wood2:#a87343;--accent:#8b5e3c;--line:#d8c5ad;--green:#607d68;--danger:#9b4b4b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fff8ed 0,#eee3d2 55%,#dfccb3 100%);color:var(--ink);font-family:Georgia,serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1250px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand h1{margin:0;font-size:2rem}.brand small{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 14px}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.search{margin:16px 0;display:flex;gap:8px}.search input{flex:1;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#fffaf5}.nav{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.nav button{white-space:nowrap;border:0;background:#e4d4bf;border-radius:999px;padding:9px 13px;color:var(--ink)}.nav button.active{background:var(--accent);color:#fff}.shelf{margin:22px 0 30px}.shelf-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.shelf-head h2{margin:0 0 8px}.shelf-head small{color:var(--muted)}.shelf-row{min-height:230px;padding:25px 22px 10px;display:flex;align-items:flex-end;gap:12px;overflow-x:auto;background:linear-gradient(#c59a6b,#b27d4b);border:12px solid #704529;border-bottom-width:18px;border-radius:10px;box-shadow:inset 0 5px 10px #4b2d1d88,0 8px 20px #53351f33}.shelf-row.dragover{outline:4px dashed #fff2d5;outline-offset:-8px}.empty{min-width:260px;padding:35px;text-align:center;color:#fff7e9}.book{flex:0 0 88px;height:185px;border-radius:5px 7px 3px 3px;position:relative;box-shadow:3px 3px 7px #3b241b88;user-select:none;touch-action:none;cursor:grab;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;font-weight:bold;overflow:hidden}.book:active{cursor:grabbing}.book.front{width:125px;flex-basis:125px}.book .spine-title{writing-mode:vertical-rl;transform:rotate(180deg);font-size:14px;padding:8px;max-height:170px}.book .cover{padding:10px;display:flex;flex-direction:column;gap:7px;justify-content:space-between;width:100%;height:100%;font-size:13px}.book .cover strong{font-size:16px}.book .cover small{opacity:.9}.book-menu{position:absolute;top:5px;right:5px;background:#fffdf8cc;color:#3b2a20;border:0;border-radius:8px;width:28px;height:28px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{font-size:1.7rem;display:block}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:15px}.card h3{margin:0 0 5px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.tag{background:#eadbc8;border-radius:999px;padding:4px 8px;font-size:12px}.modal{position:fixed;inset:0;background:#2d201888;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.dialog{background:var(--paper);width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.rating{display:flex;gap:4px;flex-wrap:wrap}.rate button{border:0;background:transparent;font-size:25px;padding:2px;opacity:.35}.rate button.on{opacity:1;transform:scale(1.06)}.checks{display:flex;flex-wrap:wrap;gap:7px}.checks label{background:#eadbc8;border-radius:999px;padding:7px 9px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}.danger{color:#fff;background:var(--danger);border-color:var(--danger)}.view-toggle{display:flex;gap:7px}.notice{padding:12px 14px;background:#f7ead7;border:1px solid var(--line);border-radius:13px;color:var(--muted)}@media(max-width:600px){.app{padding:12px}.grid{grid-template-columns:1fr}.book{height:165px}.book.front{height:185px}.shelf-row{min-height:210px;padding-left:14px;padding-right:14px}.brand h1{font-size:1.6rem}}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><h1>📚 Ma Bibliothèque</h1><small>Ma petite bibliothèque cozy, comme une vraie étagère.</small></div><div class="actions"><button class="btn primary" id="addBtn">＋ Ajouter un livre</button><button class="btn" id="viewBtn">📕 Vue : couverture</button></div></header>
<div class="search"><input id="search" placeholder="🔎 Rechercher un livre, auteur, genre…"><button class="btn" id="clearSearch">Effacer</button></div>
<nav class="nav" id="nav"></nav><section id="content"></section>
</main>
<div class="modal" id="modal"><div class="dialog"><div class="top"><h2 id="modalTitle">Ajouter un livre</h2><button class="btn" id="closeBtn">✕</button></div>
<form id="form"><input type="hidden" id="id"><div class="grid">
<div class="field"><label>Titre *</label><input id="title" required></div><div class="field"><label>Auteur</label><input id="author"></div>
<div class="field"><label>Série</label><input id="series"></div><div class="field"><label>Tome</label><input id="volume" type="number" min="0" step="1"></div>
<div class="field"><label>Statut</label><select id="status"><option value="PAL">PAL</option><option value="En cours">En cours</option><option value="Lus">Lus</option><option value="Abandonné">Abandonné</option></select></div>
<div class="field"><label>Couleur du livre</label><input id="color" type="color" value="#7a4d2d"></div>
<div class="field full"><label>Genres</label><div class="checks" id="genres"></div></div>
<div class="field full"><label>⭐ Note du livre</label><div class="rating rate" id="stars"></div></div>
<div class="field full"><label>🌶️ Spicy</label><div class="rating rate" id="spice"></div></div>
<div class="field full"><label>🙂 Humour</label><div class="rating rate" id="humor"></div></div>
<div class="field full"><label>😭 Niveau de larmes</label><div class="rating rate" id="tears"></div></div>
<div class="field full"><label>❤️ Douceur / romantisme</label><div class="rating rate" id="romance"></div></div>
<div class="field"><label>📅 Date de début</label><input id="start" type="date"></div><div class="field"><label>📅 Date de fin</label><input id="end" type="date"></div>
<div class="field"><label>📖 Pages</label><input id="pages" type="number" min="0"></div><div class="field"><label>📊 Progression (%)</label><input id="progress" type="number" min="0" max="100" value="0"></div>
<div class="field full"><label>💭 Notes / avis</label><textarea id="notes" rows="4"></textarea></div>
<div class="field full"><label>❤️ Favori</label><label><input id="favorite" type="checkbox"> Ajouter aux favoris</label></div>
</div><div class="modal-actions"><button type="button" class="btn danger" id="deleteBtn" style="display:none">Supprimer</button><button type="button" class="btn" id="cancelBtn">Annuler</button><button class="btn primary">Enregistrer</button></div></form></div></div>
<script>
const KEY='ma-bibliotheque-v2';
const genreList=['Dark romance','Romance','Romantasy','Fantasy','Thriller','Mystère','Suspense','Young Adult','Paranormal','Horreur','Comédie','Drame','Aventure','Science-fiction','Historique','Autre'];
const shelves=['Accueil','Tous','PAL','En cours','Lus','Abandonné','Favoris','Stats'];
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{books:[],view:'front',tab:'Accueil'};
const $=id=>document.getElementById(id); const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function nav(){ $('nav').innerHTML=shelves.map(x=>`<button class="${state.tab===x?'active':''}" data-tab="${x}">${x==='Accueil'?'🏠 ':''}${x}</button>`).join(''); }
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.tab=b.dataset.tab;render()});
$('viewBtn').onclick=()=>{state.view=state.view==='front'?'spine':'front';save();render()};
$('search').oninput=render;$('clearSearch').onclick=()=>{$('search').value='';render()};$('addBtn').onclick=()=>openBook();$('closeBtn').onclick=$('cancelBtn').onclick=closeModal;
function rate(id,icon){let v=state.temp?.[id]||0;$(id).innerHTML=Array.from({length:5},(_,i)=>`<button type="button" class="${i<v?'on':''}" data-v="${i+1}">${icon}</button>`).join('');$(id).onclick=e=>{let b=e.target.closest('button');if(!b)return;state.temp[id]=Number(b.dataset.v);rate(id,icon)}}
function buildGenres(selected=[]){$('genres').innerHTML=genreList.map(g=>`<label><input type="checkbox" value="${g}" ${selected.includes(g)?'checked':''}> ${g}</label>`).join('')}
function openBook(book=null){state.temp={stars:book?.stars||0,spice:book?.spice||0,humor:book?.humor||0,tears:book?.tears||0,romance:book?.romance||0};$('modal').classList.add('open');$('modalTitle').textContent=book?'Modifier le livre':'Ajouter un livre';$('deleteBtn').style.display=book?'inline-block':'none';
$('id').value=book?.id||'';$('title').value=book?.title||'';$('author').value=book?.author||'';$('series').value=book?.series||'';$('volume').value=book?.volume||'';$('status').value=book?.status||'PAL';$('color').value=book?.color||'#7a4d2d';$('start').value=book?.start||'';$('end').value=book?.end||'';$('pages').value=book?.pages||'';$('progress').value=book?.progress||0;$('notes').value=book?.notes||'';$('favorite').checked=!!book?.favorite;buildGenres(book?.genres||[]);rate('stars','⭐');rate('spice','🌶️');rate('humor','🙂');rate('tears','😭');rate('romance','❤️');}
function closeModal(){$('modal').classList.remove('open');state.temp=null}
$('form').onsubmit=e=>{e.preventDefault();const genres=[...$('genres').querySelectorAll('input:checked')].map(x=>x.value);let b={id:$('id').value||crypto.randomUUID(),title:$('title').value.trim(),author:$('author').value.trim(),series:$('series').value.trim(),volume:$('volume').value,status:$('status').value,color:$('color').value,genres,stars:state.temp.stars,spice:state.temp.spice,humor:state.temp.humor,tears:state.temp.tears,romance:state.temp.romance,start:$('start').value,end:$('end').value,pages:$('pages').value,progress:Math.max(0,Math.min(100,Number($('progress').value)||0)),notes:$('notes').value.trim(),favorite:$('favorite').checked};let i=state.books.findIndex(x=>x.id===b.id);if(i<0)state.books.push(b);else state.books[i]=b;save();closeModal();render()};
$('deleteBtn').onclick=()=>{const id=$('id').value;if(id&&confirm('Supprimer ce livre ?')){state.books=state.books.filter(b=>b.id!==id);save();closeModal();render()}};
function filtered(){let q=$('search').value.trim().toLowerCase();let arr=state.books.filter(b=>!q||[b.title,b.author,b.series,...b.genres].join(' ').toLowerCase().includes(q));if(state.tab==='PAL'||state.tab==='En cours'||state.tab==='Lus'||state.tab==='Abandonné')arr=arr.filter(b=>b.status===state.tab);if(state.tab==='Favoris')arr=arr.filter(b=>b.favorite);return arr}
function bookEl(b){const d=document.createElement('div');d.className='book '+(state.view==='front'?'front':'');d.draggable=true;d.dataset.id=b.id;d.style.background=b.color||'#7a4d2d';if(state.view==='front')d.innerHTML=`<div class="cover"><strong>${esc(b.title)}</strong><small>${esc(b.author||'Auteur inconnu')}</small><small>${b.stars?'⭐'.repeat(b.stars):''}</small></div>`;else d.innerHTML=`<div class="spine-title">${esc(b.title)}${b.author?' — '+esc(b.author):''}</div>`;d.title='Glisse-moi pour me déplacer';d.addEventListener('click',e=>{if(!e.target.closest('.book-menu'))openBook(b)});d.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',b.id));return d}
function shelf(title,arr){const sec=document.createElement('section');sec.className='shelf';sec.innerHTML=`<div class="shelf-head"><div><h2>${title}</h2><small>${arr.length} livre${arr.length!==1?'s':''} · Glisse les livres pour les réorganiser</small></div></div><div class="shelf-row"></div>`;const row=sec.querySelector('.shelf-row');if(!arr.length)row.innerHTML='<div class="empty">Cette étagère est vide.<br>Ajoute un livre pour commencer ✨</div>';arr.forEach(b=>row.appendChild(bookEl(b)));row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('dragover')});row.addEventListener('dragleave',()=>row.classList.remove('dragover'));row.addEventListener('drop',e=>{e.preventDefault();row.classList.remove('dragover');const id=e.dataTransfer.getData('text/plain');const book=state.books.find(x=>x.id===id);if(!book)return;const target=e.target.closest('.book');if(target&&target.dataset.id!==id){const ti=state.books.findIndex(x=>x.id===target.dataset.id),bi=state.books.findIndex(x=>x.id===id);state.books.splice(bi,1);let ni=state.books.findIndex(x=>x.id===target.dataset.id);state.books.splice(ni,0,book)}save();render()});return sec}
function render(){nav();$('viewBtn').textContent=state.view==='front'?'📕 Vue : couverture':'📖 Vue : dos';const c=$('content');c.innerHTML='';let arr=filtered();if(state.tab==='Accueil'){c.appendChild(shelf('📚 Ma bibliothèque',arr));c.appendChild(shelf('📝 PAL',state.books.filter(b=>b.status==='PAL')));c.appendChild(shelf('📖 En cours',state.books.filter(b=>b.status==='En cours')));c.appendChild(shelf('❤️ Favoris',state.books.filter(b=>b.favorite)));}else if(state.tab==='Stats'){renderStats(c)}else c.appendChild(shelf(state.tab,arr))}
function renderStats(c){let n=state.books.length,avg=n?Math.round(state.books.reduce((a,b)=>a+b.stars,0)/n*10)/10:0;c.innerHTML=`<div class="stats"><div class="stat"><b>${n}</b>Total</div><div class="stat"><b>${state.books.filter(b=>b.status==='Lus').length}</b>Lus</div><div class="stat"><b>${state.books.filter(b=>b.status==='PAL').length}</b>PAL</div><div class="stat"><b>${avg} ⭐</b>Note moyenne</div><div class="stat"><b>${state.books.filter(b=>b.genres.includes('Dark romance')).length}</b>Dark romance</div></div><div class="notice" style="margin-top:14px">Tes évaluations 🌶️🙂😭❤️ sont enregistrées dans chaque fiche de livre.</div>`}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
